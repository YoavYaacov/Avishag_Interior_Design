<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>מערכת ניהול לקוחות - אבישג עיצוב פנים</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <!-- מסך התחברות -->
    <div id="login-view" class="center-screen">
        <div class="card">
            <h1>מערכת ניהול לקוחות</h1>
            <p class="subtitle">אבישג · עיצוב פנים</p>
            <form id="login-form">
                <label for="email">אימייל</label>
                <input type="email" id="email" required autocomplete="username" />
                <label for="password">סיסמה</label>
                <input type="password" id="password" required autocomplete="current-password" />
                <p id="login-error" class="error-text"></p>
                <button type="submit">התחברות</button>
            </form>
        </div>
    </div>

    <!-- אפליקציה ראשית -->
    <div id="dashboard-view" class="hidden">
        <header class="top-bar">
            <h1>מערכת ניהול לקוחות</h1>
            <div class="user-info">
                <span id="user-email"></span>
                <button id="logout-btn">התנתקות</button>
            </div>
        </header>

        <nav class="main-nav">
            <button class="nav-btn active" data-view="leads">פניות</button>
            <button class="nav-btn" data-view="clients">לקוחות</button>
            <button class="nav-btn" data-view="tasks">משימות</button>
            <button class="nav-btn" data-view="payments">תשלומים</button>
            <button class="nav-btn" data-view="commission">עמלות</button>
            <button class="nav-btn" data-view="suppliers">ספקים</button>
            <button class="nav-btn" data-view="tracks">מסלולים</button>
            <button class="nav-btn" data-view="diagnostics">בדיקת מערכת</button>
        </nav>

        <main>
            <!-- ===== פניות (LEADS) ===== -->
            <section id="leads-view" class="app-view">
                <div class="view-header">
                    <h2>פניות</h2>
                    <button id="new-lead-btn" class="btn-primary">+ פנייה חדשה</button>
                </div>
                <div id="leads-table-container"></div>
            </section>

            <!-- ===== לקוחות (CLIENTS) ===== -->
            <section id="clients-view" class="app-view hidden">

                <!-- תצוגת רשימה -->
                <div id="clients-list-view">
                    <div class="view-header">
                        <h2>לקוחות</h2>
                        <input type="text" id="clients-search" placeholder="חיפוש לפי שם..." class="search-input" />
                    </div>
                    <div id="clients-table-container"></div>
                </div>

                <!-- תצוגת כרטיס לקוח -->
                <div id="client-detail-view" class="hidden"></div>
            </section>

            <!-- ===== משימות (TASKS) - חוצה-לקוחות ===== -->
            <section id="tasks-view" class="app-view hidden">
                <div class="view-header">
                    <h2>משימות</h2>
                    <button type="button" class="btn-small btn-ghost" data-action="refresh-tasks">↻ רענון</button>
                </div>
                <div id="tasks-table-container"></div>
            </section>

            <!-- ===== תשלומים (PAYMENTS) - חוצה-לקוחות ===== -->
            <section id="payments-view" class="app-view hidden">
                <div class="view-header">
                    <h2>תשלומים</h2>
                </div>
                <div id="payments-table-container"></div>
            </section>

            <!-- ===== עמלות מחברות עיצוב (COMMISSION_INCOME) - חוצה-לקוחות ===== -->
            <section id="commission-view" class="app-view hidden">
                <div class="view-header">
                    <h2>עמלות</h2>
                </div>
                <div id="commission-table-container"></div>
            </section>

            <!-- ===== ספקים/קבלנים (SUPPLIERS) - חוצה-לקוחות ===== -->
            <section id="suppliers-view" class="app-view hidden">
                <div class="view-header">
                    <h2>ספקים</h2>
                </div>
                <div id="suppliers-table-container"></div>
            </section>

            <!-- ===== מסלולים (TRACKS) ===== -->
            <section id="tracks-view" class="app-view hidden">
                <div class="view-header">
                    <h2>מסלולים</h2>
                    <button id="new-track-btn" class="btn-primary">+ מסלול חדש</button>
                </div>
                <div id="tracks-table-container"></div>
            </section>

            <!-- ===== בדיקת מערכת (קיים) ===== -->
            <section id="diagnostics-view" class="app-view hidden">
                <p id="status-message">בודקת חיבור...</p>
                <div id="status-grid" class="status-grid"></div>
            </section>
        </main>
    </div>

    <!-- מודאל כללי -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal-box" id="modal-box"></div>
    </div>

    <!-- הודעת טוסט -->
    <div id="toast" class="toast hidden"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/tracks.js"></script>
    <script src="js/leads.js"></script>
    <script src="js/clients.js"></script>
    <script src="js/photos.js"></script>
    <script src="js/payments.js"></script>
    <script src="js/commission.js"></script>
    <script src="js/suppliers.js"></script>
    <script src="js/tasks.js"></script>

    <!--
        תיקון באג: קריאה ל-checkSession() נעשית כאן, אחרי שכל קבצי ה-JS נטענו,
        ולא בסוף js/app.js. הסיבה: getSession() בד"כ מסתיים מהר (בלי קריאת רשת),
        ואם הקריאה הראשונית ל-checkSession() נעשית מתוך app.js עצמו, ה-switchView("leads")
        שבתוכה עלול לרוץ לפני ש-js/leads.js נטען - מה שגורם למסך "פניות" להיפתח ריק
        עד שלוחצים על הטאב שוב.
    -->
    <script>checkSession();</script>
</body>
</html>
